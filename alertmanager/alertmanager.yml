# Mặc định: chỉ gom cảnh báo, xem tại http://localhost:9093
# Chạy scripts/install.ps1 và nhập token Telegram để file này được ghi đè tự động,
# hoặc bỏ comment khối telegram_configs bên dưới và điền tay.
route:
  receiver: default
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
